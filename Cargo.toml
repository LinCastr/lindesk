[workspace]
resolver = "3"
members = ["crates/proto", "crates/host", "crates/client", "crates/app"]
exclude = ["tools"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
lindesk-proto = { path = "crates/proto" }

[profile.release]
lto = "thin"
codegen-units = 4
